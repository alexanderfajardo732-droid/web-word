<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="EducaMundo: aprende programación web, HTML, CSS, JavaScript y desarrollo de aplicaciones.">
<title>EducaMundo | Aprende Programación Web</title>

<style>
:root {
    --morado: #6339df;
    --azul: #08b8d2;
    --oscuro: #282044;
    --fondo: #f5f4ff;
    --naranja: #ff9f32;
}

* {
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--fondo);
    color: var(--oscuro);
    line-height: 1.6;
}

header {
    background: linear-gradient(120deg, #6339df, #08b8d2);
    color: white;
    padding: 55px 20px;
    text-align: center;
}

header h1 {
    font-size: 43px;
    margin: 0;
}

header p {
    font-size: 18px;
}

nav {
    background: #352078;
    padding: 15px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 18px;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

nav a:hover {
    color: #ffd166;
}

section {
    padding: 45px 20px;
    text-align: center;
    scroll-margin-top: 70px;
}

h2 {
    color: var(--morado);
    font-size: 29px;
}

h3 {
    color: var(--morado);
}

.inicio {
    background: #e8eaff;
    padding: 65px 20px;
}

.inicio h2 {
    font-size: 36px;
}

.boton {
    display: inline-block;
    background: var(--naranja);
    color: white;
    padding: 13px 23px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
    margin: 8px;
}

.boton:hover {
    opacity: .85;
}

.boton-morado {
    background: var(--morado);
}

.contenedor {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.tarjeta {
    background: white;
    padding: 25px;
    width: 260px;
    border-radius: 16px;
    box-shadow: 0 4px 14px #d9d7e9;
}
